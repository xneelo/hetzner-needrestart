---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - master
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puppet:
    name: Puppet
    uses: voxpupuli/gha-puppet/.github/workflows/basic.yml@v3
